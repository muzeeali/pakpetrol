name: Update fuel prices

on:
  schedule:
    # 12:03 AM and 12:10 AM Pakistan time.
    # Pakistan is UTC+5, so these are 19:03 and 19:10 UTC.
    - cron: "3 19 * * *"
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fuel-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update config.json
        run: python scripts/update_prices.py

      - name: Commit changed prices
        run: |
          if git diff --quiet -- config.json; then
            echo "No price changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config.json
          git commit -m "chore: update fuel prices from OGRA API"
          git push
