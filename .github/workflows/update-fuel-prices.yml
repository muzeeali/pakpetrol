name: Update fuel prices

on:
  schedule:
    - cron: "10 15 * * *" # 4:55 PM PKT
    - cron: "15 15 * * *"  # 5:01 PM PKT
    - cron: "20 15 * * *"  # 5:06 PM PKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fuel-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update config.json
        run: python scripts/update_prices.py

      - name: Commit changed prices
        run: |
          if git diff --quiet -- config.json; then
            echo "No price changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config.json
          git commit -m "chore: update fuel prices from OGRA API"
          git push
